<!-- Barra de Productos Flotante Mejorada -->
<div id="product-showcase-bar" class="product-showcase-bar">
    <!-- Botón de cierre más estilizado -->
    <button id="close-showcase-btn" class="showcase-close-btn" aria-label="Cerrar ofertas">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
    </button>

    <div class="container-fluid py-3">
        <div class="d-flex justify-content-between align-items-center mb-2 px-2">
            <h5 class="showcase-title mb-0">
                <span class="icon">🔥</span>
                Ofertas Imperdibles
            </h5>
            <small class="scroll-hint">Desliza para ver más →</small>
        </div>
        <div id="showcase-items-container" class="showcase-items-container">
            <!-- Los productos se cargarán aquí vía JavaScript -->
        </div>
    </div>
</div>
