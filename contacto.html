<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto | Tienda Outdoor</title>
  <meta name="description" content="Contáctanos para más información sobre productos de camping y promociones.">
  <link rel="stylesheet" href="css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <!-- Placeholder para el Navbar -->
  <div id="header-placeholder"></div>

  <!-- HERO -->
  <section class="hero text-center text-white" style="background-image: url('assets/images/camping-hero.png'); padding-top: 56px;">
    <div class="container py-5">
      <h1 class="display-4 fw-bold">Contáctanos</h1>
      <p class="lead mb-4">¿Tienes dudas o sugerencias? Escríbenos y te responderemos pronto.</p>
    </div>
  </section>

  <!-- FORMULARIO -->
  <section id="contacto" class="py-5">
    <div class="container">
      <h2 class="fw-bold mb-4 text-center">Formulario de Contacto</h2>
      <div class="row justify-content-center">
        <div class="col-md-8">
          <form action="https://formspree.io/f/tu_codigo_aqui" method="POST">
            <div class="mb-3">
              <label for="nombre" class="form-label">Nombre</label>
              <input type="text" id="nombre" name="nombre" class="form-control" required>
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Correo electrónico</label>
              <input type="email" id="email" name="email" class="form-control" required>
            </div>
            <div class="mb-3">
              <label for="mensaje" class="form-label">Mensaje</label>
              <textarea id="mensaje" name="mensaje" class="form-control" rows="4" required></textarea>
            </div>
            <button type="submit" class="btn btn-success w-100">Enviar</button>
          </form>
        </div>
      </div>
    </div>
  </section>

  <!-- Placeholder para el Footer -->
  <div id="footer-placeholder"></div>

  <!-- Placeholder para la Barra de Productos Flotante -->
  <div id="showcase-placeholder"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
