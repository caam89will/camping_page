<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productos de Camping | Tienda Outdoor</title>
  <meta name="description" content="Explora nuestra selección de productos de camping: carpas, mochilas, linternas y más para tus aventuras al aire libre.">
  <link rel="stylesheet" href="css/style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <!-- Placeholder para el Navbar -->
  <div id="header-placeholder"></div>

  <!-- HERO PRODUCTOS -->
  <section class="hero text-center text-white" style="background-image: url('assets/images/camping-hero.png'); padding-top: 56px;">
    <div class="container py-5">
      <h1 class="display-4 fw-bold">Nuestros Productos de Camping</h1>
      <p class="lead mb-4">Carpas, mochilas, linternas y todo lo que necesitas para tus aventuras al aire libre.</p>
    </div>
  </section>

  <!-- LISTADO DE PRODUCTOS -->
  <section id="productos-list" class="py-5">
    <div class="container">
      <h2 class="fw-bold mb-4 text-center">Productos Destacados</h2>
      <div class="row g-4" id="productos-container">
        <!-- Productos se cargarán dinámicamente desde productos.json -->
      </div>
    </div>
  </section>

  <!-- Placeholder para el Footer -->
  <div id="footer-placeholder"></div>

  <!-- Placeholder para la Barra de Productos Flotante -->
  <div id="showcase-placeholder"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
